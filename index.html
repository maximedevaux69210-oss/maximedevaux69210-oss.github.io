<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16110d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>[hidden]{display:none!important}html,body{margin:0;background:#16110d}</style>
<title>Club de l'Arène</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout : appli une colonne, en-tête de club, contenu défilant, onglets en bas. Look unique : pierre d'arène sombre + bronze, cadres colorés par rareté. */
:root{
  --bg:#17130f; --panel:#221b15; --panel2:#2c231b; --line:#3d3127;
  --fg:#f0e5d3; --muted:#a8977f; --bronze:#dc9c3f; --blood:#d0503a; --heal:#6cbf7a; --mana:#5c8fe0;
  --r-commun:#9a8b78; --r-peucommun:#62b86a; --r-rare:#4f9be0; --r-epique:#b06ce0; --r-legendaire:#f0b43a;
  --display:"Pirata One",Georgia,serif; --body:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;margin:0;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--bronze);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}
header{padding-block:12px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:linear-gradient(180deg,#241b13,var(--bg))}
.brand{font-family:var(--display);font-size:30px;line-height:1;color:var(--bronze)}
.stats{display:flex;gap:14px;margin-top:6px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.stats b{color:var(--fg);font-variant-numeric:tabular-nums}
.gold b{color:var(--bronze)}
main{flex:1;overflow-y:auto;padding-block:14px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav button{padding:14px 4px 12px;font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:3px solid transparent}
nav button[aria-selected="true"]{color:var(--bronze);border-top-color:var(--bronze)}
h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 4px}
.hint{color:var(--muted);font-size:14px;margin:0 0 14px}
.list{display:flex;flex-direction:column;gap:10px}
.merc{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--rc);border-radius:10px;padding:10px}
.pt{width:60px;height:60px;border-radius:6px;border:2px solid var(--rc);image-rendering:pixelated;display:block;background:var(--panel2)}
.ptb{padding:0;position:relative}
.ptb::after{content:"i";position:absolute;right:-5px;bottom:-5px;width:18px;height:18px;border-radius:50%;background:var(--rc);color:#120d08;font-weight:700;font-size:12px;display:grid;place-items:center}
.name{font-weight:700;font-size:17px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.rar{color:var(--rc);font-weight:700}
.line{display:flex;gap:9px;font-size:14px;margin-top:3px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.line span{color:var(--muted)} .line b{color:var(--fg)}
.skill{font-size:13px;color:var(--mana);margin-top:2px}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--panel2);color:var(--heal)}
.chip.neg{color:var(--blood)}
.acts{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.row{display:flex;gap:6px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:default}
.btn.main{background:var(--bronze);color:#1b130a;border-color:var(--bronze)}
.btn.sq{width:38px;padding:8px 0}
.big{width:100%;padding:14px;font-size:18px;font-weight:700;border-radius:10px}
.empty{border:1px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted)}
.section{margin-top:22px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:8px 4px;border-bottom:1px solid var(--line)}
th.n,td.n{text-align:right}
tr.me td{color:var(--bronze);font-weight:700}
.opp{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.vs{font-family:var(--display);font-size:26px;line-height:1.1}
.mini{display:flex;gap:8px;margin:10px 0 14px;flex-wrap:wrap}
.mini .pt{width:48px;height:48px}
.lvl{font-size:12px;color:var(--muted);text-align:center}
.legend{display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--muted)}
.legend b{color:var(--fg)}
.odds{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;margin-bottom:12px}
.odds span{color:var(--rc);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);z-index:40}
/* Fiche */
.sheet-bg{position:fixed;inset:0;background:rgba(8,6,4,.7);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);border-top:3px solid var(--rc);border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:88%;overflow-y:auto;padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.sh-top{display:flex;gap:14px;align-items:center}
.sh-top .pt{width:104px;height:104px;border-width:3px}
.sh-name{font-family:var(--display);font-size:28px;line-height:1}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.statgrid div{background:var(--panel2);border-radius:8px;padding:8px;text-align:center}
.statgrid b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.statgrid span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.blk{border-top:1px solid var(--line);padding-top:10px;margin-top:10px;font-size:15px}
.blk h3{margin:0 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.blk p{margin:2px 0}
.sk-name{color:var(--mana);font-weight:700}
.tr-pos{color:var(--heal);font-weight:700} .tr-neg{color:var(--blood);font-weight:700}
/* Formation (onglet Équipe) */
.board{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:16px}
.brow{display:grid;grid-template-columns:86px 1fr 1fr;gap:8px;align-items:center}
.brow+.brow{margin-top:8px}
.blab{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);line-height:1.2}
.slot{display:flex;gap:8px;align-items:center;background:var(--panel2);border:1px dashed var(--line);border-radius:8px;padding:6px;min-height:52px;min-width:0}
.slot.on{border-style:solid;border-color:var(--rc)}
.slot .pt{width:38px;height:38px;border-width:1px}
.slot span{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot em{font-style:normal;font-size:13px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;padding:7px 6px;font-size:13px;font-weight:600;color:var(--muted);background:var(--panel2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--bronze);color:#1b130a}
.merc.v3{grid-template-columns:60px minmax(0,1fr)}
.merc.v3 .acts{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}
.merc.v3 .acts .seg{flex:1 1 100%}
.merc.v3 .acts .btn{flex:1}
.range{font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:1px}
.arenacard{display:flex;gap:10px;align-items:center;border-radius:8px;padding:8px 10px;margin:4px 0 12px;color:#fff6e6;text-shadow:0 1px 2px rgba(0,0,0,.6);font-size:14px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tcell{display:flex;gap:8px;align-items:flex-start;background:var(--card,rgba(255,255,255,.04));border-radius:8px;padding:6px}.tcell img{width:40px;flex:none;image-rendering:pixelated;border-radius:4px}.tcell b{display:block;font-size:14px}.tcell span{font-size:12px;color:var(--muted);line-height:1.25;display:block}
@media (max-width:360px){.tgrid{grid-template-columns:1fr}}
.arenacard .amini{width:62px;height:auto;flex:none;border-radius:6px;image-rendering:pixelated;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.arenacard b{display:block;font-family:var(--display);font-weight:400;font-size:20px;line-height:1}
.oform{display:grid;grid-template-columns:76px 1fr;gap:6px 8px;align-items:center;margin:10px 0 14px}
.oform .mini{margin:0}
/* Combat */
.arena{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.atop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;max-width:520px;width:100%;margin:10px auto 0}
.atop .vs{font-size:20px;color:var(--blood);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.atop .sub{white-space:nowrap}
.field{position:relative;flex:1;min-height:0;display:grid;grid-template-rows:1fr 1fr auto 1fr 1fr;gap:4px;border-radius:16px;margin:8px auto 0;width:100%;max-width:520px;padding:8px 6px;overflow:hidden;
  background:repeating-radial-gradient(ellipse at 50% 50%,transparent 0 38px,rgba(0,0,0,.07) 38px 40px),radial-gradient(ellipse at 50% 50%,var(--a1) 0%,var(--a2) 85%);box-shadow:inset 0 0 0 3px rgba(0,0,0,.35),inset 0 0 40px rgba(0,0,0,.45)}
.frow{display:flex;justify-content:center;align-items:center;gap:10px;min-height:0}
.tok{position:relative;width:min(47%,170px);display:grid;grid-template-columns:42px minmax(0,1fr);gap:6px;align-items:center;background:rgba(22,17,13,.82);border:1px solid rgba(255,255,255,.08);border-left:3px solid var(--rc);border-radius:9px;padding:5px 6px;transition:opacity .3s}
.tok.empty{background:rgba(0,0,0,.12);border:1px dashed rgba(0,0,0,.25);height:54px}
.tok .pt{width:42px;height:42px;border-width:1px}
.tok .fn{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.bar{height:6px;background:#0e0b08;border-radius:3px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--heal);transition:width .25s}
.bar.mn{height:4px}.bar.mn i{background:var(--mana)}
.tok.low .bar.hp i{background:var(--blood)}
.tok.full .bar.mn i{background:#9fc2ff}
.st{display:flex;gap:2px;min-height:12px;margin-top:3px;flex-wrap:wrap}
.st b{font-size:9px;line-height:12px;padding:0 3px;border-radius:3px;color:#120d08}
.tok.dead{opacity:.28;filter:grayscale(1)}
.tok.act{border-color:var(--bronze);box-shadow:0 0 0 1px var(--bronze)}
.tok.cast{box-shadow:0 0 0 2px var(--mana),0 0 16px var(--mana)}
.tok.hit{animation:shake .3s}
@keyframes shake{25%{translate:-4px 0}75%{translate:4px 0}}
.pop{position:absolute;left:50%;top:-6px;transform:translateX(-50%);font-weight:700;font-size:16px;pointer-events:none;animation:up .9s forwards;text-shadow:0 1px 2px #000,0 0 3px #000;white-space:nowrap;z-index:3}
.pop.d{color:#ff7a62} .pop.h{color:#8af09a} .pop.m{color:#e8e0d0;font-size:13px} .pop.c{color:#ffcf5a;font-size:20px}
@keyframes up{to{transform:translate(-50%,-28px);opacity:0}}
.mid{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;font-size:15px;text-align:center;padding:4px 6px;min-height:58px;background:rgba(10,8,6,.55);border-radius:8px;color:#bfae95}
.mid div:last-child{color:#f6ecdc;font-weight:600}
.mid .skl{color:#9fc2ff!important}
.proj{position:absolute;left:0;top:0;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;pointer-events:none;z-index:4}
.proj.arrow{width:16px;height:3px;margin:-1px 0 0 -8px;border-radius:2px;background:#f3e6c8;box-shadow:0 0 3px #000}
.proj.fire{width:16px;height:16px;margin:-8px 0 0 -8px;background:radial-gradient(circle,#fff3a0,#ff8a2a 55%,#c0301a);box-shadow:0 0 12px #ff7a2a}
.proj.holy{background:radial-gradient(circle,#fff,#ffe27a);box-shadow:0 0 12px #ffe27a}
.proj.dark{background:radial-gradient(circle,#e6c8ff,#7a3fb0);box-shadow:0 0 12px #9a5ad0}
.proj.nature{background:radial-gradient(circle,#e6ffc8,#4fa03a);box-shadow:0 0 10px #6ac04a}
.proj.song{width:10px;height:10px;background:#ffb6e6;box-shadow:0 0 10px #ff8ad0}
.ctrl{display:flex;gap:8px;max-width:520px;width:100%;margin:10px auto 12px}
.ctrl .btn{flex:1;padding:12px}
.endscr{flex:1;min-height:0;overflow-y:auto;max-width:520px;width:100%;margin:8px auto 0;display:flex;flex-direction:column;gap:12px}
.result{font-family:var(--display);font-size:46px;line-height:1;text-align:center;margin-top:6px}
.mvp{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--rc);border-radius:10px;padding:10px}
.mvp .pt{width:56px;height:56px}
.stt td,.stt th{padding:6px 4px;font-size:14px}
.stt .who{display:flex;gap:6px;align-items:center;min-width:0}
.stt .who .pt{width:26px;height:26px;border-width:1px;flex:none}
.stt .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.lines line{stroke-width:3;stroke-linecap:round;stroke-dasharray:6 5;opacity:.9}
.banner{position:absolute;left:50%;top:13%;transform:translate(-50%,-50%) scale(.9);z-index:5;pointer-events:none;text-align:center;opacity:0;transition:opacity .15s,transform .2s;
  background:rgba(12,10,20,.78);border:2px solid var(--mana);border-radius:12px;padding:5px 14px;box-shadow:0 0 24px rgba(92,143,224,.6);max-width:90%}
.banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.banner b{display:block;font-family:var(--display);font-weight:400;font-size:19px;line-height:1;color:#cfe0ff}
.banner span{font-size:13px;color:#e6dccb}
.tok.tgt{box-shadow:0 0 0 2px #ff6a4a}
.stage{position:relative;flex:1;min-height:0;max-width:520px;width:100%;margin:8px auto 0;border-radius:16px;overflow:hidden;background:#1a140f}
.stage canvas{display:block;width:100%;height:100%}
.ticker{position:absolute;left:8px;right:8px;bottom:8px;display:flex;flex-direction:column-reverse;gap:2px;align-items:center;pointer-events:none;font-size:13px;color:#e6dccb;text-shadow:0 1px 2px #000}
.ticker div{background:rgba(12,10,8,.7);border-radius:6px;padding:2px 8px;max-width:100%}
.ticker div:last-child{font-size:14px;color:#fff}
.ctrl .btn[aria-pressed="true"]{border-color:var(--bronze);color:var(--bronze)}
.ord{display:flex;align-items:center;gap:8px;flex:1 1 100%;font-size:13px;color:var(--muted)}
.ord select{flex:1;min-width:0;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:14px}
.orders{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:14px;color:var(--muted)}
.orders summary{cursor:pointer;color:var(--fg);font-weight:600}
.orders div{margin-top:6px}.orders b{color:var(--fg)}
/* V3.3 tactique */
.crown{color:#ffd23a;font-style:normal}
.muted{color:var(--muted)}
.rl{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.3}.rl b{color:var(--fg);font-weight:600}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:12px}
.plan{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:5px;text-align:center}
.plan b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--bronze)}
.btn.sm{padding:6px 4px;font-size:12px}
.enemyside{text-align:center;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--blood);margin:2px 0 6px}
.grid3{display:grid;grid-template-columns:52px repeat(3,minmax(0,1fr));gap:6px;align-items:stretch}
.glab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center}
.cell{position:relative;background:var(--panel2);border:1px dashed var(--line);border-radius:9px;min-height:74px;padding:5px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0}
.cell.on{border:2px solid var(--rc);background:var(--panel)}
.cell.sel{box-shadow:0 0 0 3px var(--bronze);background:#3a2c1c}
.cell .pt{width:40px;height:40px;border-width:1px}
.cell span{font-size:12px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell em{font-style:normal;font-size:10px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .crown{position:absolute;top:2px;right:5px;font-size:14px}
.grid3.live .cell:not(.on) em{color:var(--bronze);font-size:11px}
.benchzone{display:grid;grid-template-columns:52px 1fr;gap:6px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.benchrow{display:flex;gap:6px;flex-wrap:wrap;min-height:60px;align-items:center}
.cell.mini{min-height:60px;width:70px}
.cell.mini .pt{width:32px;height:32px}
.empty-b{font-style:normal;font-size:13px;color:var(--muted)}
.syn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 14px;font-size:14px}
.syn h3{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.syn p{margin:4px 0}.syn b{color:var(--heal)}
.leader{display:flex;gap:10px;align-items:center;margin:8px 0 12px}
.leader .pt{width:56px;height:56px}
.leader b{font-family:var(--display);font-weight:400;font-size:20px}
.opp .grid3{margin-top:6px}
.rsel{display:flex;align-items:center;gap:10px;margin-top:10px}
.rsel span{width:96px;flex:none;font-size:13px;color:var(--muted)}
.rsel select{flex:1;min-width:0;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px;font:inherit;font-size:15px}
.rdesc{font-size:13px;color:var(--muted);margin:4px 0 0 106px!important}
.chk{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:14px}
.chk input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--bronze)}
.tip{color:var(--bronze);font-style:italic}
.dom{display:flex;height:8px;max-width:520px;width:100%;margin:8px auto 0;border-radius:4px;overflow:hidden;background:#0e0b08}
.dom i{display:block;height:100%;transition:width .3s}
#domA{background:#f0b43a}#domB{background:#e0452f;margin-left:auto}

/* ===== V4.0 · Or et ébène ===== */
:root{
  --bg:#14100d; --panel:#211a15; --panel2:#2a211b; --line:#3a2e25; --fg:#efe4cf; --muted:#a5967f;
  --gild:#c9a45c; --gild-hi:#ecd497; --gild-lo:#7d6230; --ink:#1c140b; --bronze:#c9a45c; --blood:#c4513c; --heal:#74b884; --mana:#6b9be6;
  --r-commun:#a39787; --r-peucommun:#78b87e; --r-rare:#5fa2e6; --r-epique:#b17ae6; --r-legendaire:#e8b84f; --r-mythique:#ff6b57; --r-divin:#fff0bd;
  --display:"Cinzel",Georgia,serif; --body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --card:linear-gradient(180deg,#251d17,#1c1612); --hair:rgba(201,164,92,.22);
}
body{background:radial-gradient(120% 60% at 50% 0%,#221a14 0%,var(--bg) 60%) fixed,var(--bg);font-size:16px;letter-spacing:.005em}
header{background:linear-gradient(180deg,#1f1813,rgba(20,16,13,.96));border-bottom:1px solid var(--hair);box-shadow:0 1px 0 rgba(0,0,0,.5)}
.hd{display:flex;align-items:center;gap:12px}
.crest{width:38px;height:44px;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.hd-t{flex:1;min-width:0}
.brand{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.05;color:var(--gild-hi);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{gap:10px;margin-top:3px;font-size:13px;flex-wrap:nowrap;white-space:nowrap}
.stats b{color:var(--fg)}
.coin{display:flex;align-items:center;gap:6px;padding:6px 11px 6px 7px;border-radius:999px;background:linear-gradient(180deg,#2c2219,#1d1611);border:1px solid var(--hair);box-shadow:inset 0 1px 0 rgba(255,230,170,.08)}
.coin svg{width:20px;height:20px}
.coin b{font-family:var(--display);font-weight:700;font-size:16px;color:var(--gild-hi);font-variant-numeric:tabular-nums}
nav{grid-template-columns:repeat(4,1fr);background:linear-gradient(180deg,#1d1612,#15110e);border-top:1px solid var(--hair)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 10px;font-size:12.5px;font-weight:500;letter-spacing:.02em;text-transform:none;color:var(--muted);border-top:0;position:relative}
nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected="true"]{color:var(--gild-hi)}
nav button[aria-selected="true"]::before{content:"";position:absolute;top:-1px;left:28%;right:28%;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--gild-hi),transparent)}
h2{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.02em;color:var(--gild-hi);margin:0 0 6px}
.sub{text-transform:none;letter-spacing:.01em;font-size:13px}
.hint{font-size:14px}
.btn{background:linear-gradient(180deg,#2c231c,#221a15);border:1px solid var(--hair);border-radius:10px;color:var(--fg);font-weight:600;box-shadow:inset 0 1px 0 rgba(255,230,170,.05);transition:transform .08s,filter .15s}
.btn:active:not(:disabled){transform:translateY(1px);filter:brightness(1.1)}
.btn.main{background:linear-gradient(180deg,#efd796 0%,#c9a45c 52%,#a5803c 100%);color:var(--ink);border:1px solid #f4e2ab;text-shadow:0 1px 0 rgba(255,245,215,.45);box-shadow:0 4px 14px rgba(201,164,92,.25),inset 0 -2px 0 rgba(90,60,20,.35)}
.big{border-radius:12px;font-size:17px}
.section{margin-top:24px}
.opp,.board,.panel{background:var(--card);border:1px solid var(--hair);border-radius:16px;box-shadow:0 10px 26px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,230,170,.04)}
.vs{font-family:var(--display);font-weight:700;color:var(--fg);font-size:23px}
table{font-size:15px}th{text-transform:none;letter-spacing:0;font-size:13px}td,th{border-bottom-color:var(--line)}
tr.me td{color:var(--gild-hi)}
select{accent-color:var(--gild)}
/* plateau */
.board{padding:8px;margin-bottom:12px}
.arenab{border-radius:12px;box-shadow:none}
.ab-e{border:0;background:transparent;border-radius:50%}
.ab-u{justify-content:flex-start;background:none;padding:0}
.ab-u img{height:60%;margin-top:3%;filter:drop-shadow(0 3px 2px rgba(0,0,0,.55))}
.ab-u span{background:rgba(18,14,11,.88);color:var(--fg);border-radius:6px;padding:1px 6px;font-size:11.5px;font-weight:700;border:0;border-bottom:2px solid var(--rc);margin-top:3%}
.ab-u em{color:#cbbda6;font-size:10.5px;font-weight:500;margin-top:1px;text-shadow:0 1px 2px #000}
.ab-u em.tg{color:var(--gild-hi)}
.ab-u.over,.ab-e.over{background:radial-gradient(circle,rgba(236,212,151,.35),transparent 70%);box-shadow:none}
.ghost.ab-u{background:rgba(30,23,18,.92);border:1px solid var(--hair)}
.benchzone{border-top:1px solid var(--line);grid-template-columns:48px 1fr}
.glab{text-transform:none;letter-spacing:.01em;font-size:12.5px}
.cell{background:linear-gradient(180deg,#2a211b,#201913);border:1px solid var(--line)}
.cell.on{border:1px solid var(--rc)}
.tbar2 select,.testrow select,.rsel select{background:#1d1612;border-color:var(--hair);border-radius:10px}
.synchip{background:var(--card);border-color:var(--hair);border-radius:12px}
.synchip summary{color:var(--gild-hi)}
.sect{font-family:var(--display);font-weight:700;font-size:17px;text-transform:none;letter-spacing:.02em;color:var(--gild-hi);margin:20px 2px 10px}
/* cartes d'effectif */
.roster{gap:8px}
.rcard{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:10px 12px 10px 10px;color:var(--fg);position:relative;overflow:hidden}
.rcard::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--rc)}
.por{position:relative;width:58px;height:58px;border-radius:12px;padding:2px;background:linear-gradient(145deg,var(--rc),color-mix(in srgb,var(--rc) 35%,#000));box-shadow:0 3px 8px rgba(0,0,0,.45)}
.por img{width:100%;height:100%;border-radius:10px;image-rendering:pixelated;display:block;background:#1a1410}
.por .crown{position:absolute;top:-7px;right:-6px;font-size:16px;text-shadow:0 1px 2px #000}
.rc-name{display:block;font-weight:700;font-size:16.5px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-meta{display:block;font-size:13px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-meta .rar{color:var(--rc);font-weight:700}
.rc-bars{display:grid;grid-template-columns:30px 1fr 30px;gap:3px 6px;align-items:center;margin-top:6px;font-size:11.5px;color:var(--muted)}
.rc-bars i{height:5px;border-radius:3px;background:#120e0b;overflow:hidden;display:block}
.rc-bars i b{display:block;height:100%;border-radius:3px}
.rc-bars em{font-style:normal;color:var(--fg);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.rc-side{display:flex;flex-direction:column;align-items:flex-end;gap:5px;text-align:right}
.pw{font-family:var(--display);font-weight:700;font-size:20px;line-height:1;color:var(--gild-hi);font-variant-numeric:tabular-nums}
.pw small{display:block;font-family:var(--body);font-weight:500;font-size:11px;color:var(--muted)}
.rc-pos{font-size:12px;color:var(--muted);white-space:nowrap}
.rc-prof{display:flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap}
.rc-sk{display:flex;gap:3px}.rc-sk .ski{width:22px;height:22px;border-radius:6px;border-width:1px}.rc-sk .ski svg{width:13px;height:13px}.rc-sk .ski i{display:none}
/* ligue */
.op-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.stylebadge{flex:none;font-family:var(--display);font-weight:700;font-size:13px;color:var(--ink);background:linear-gradient(180deg,#efd796,#b8913f);border-radius:999px;padding:4px 11px;margin-top:4px}
.orow{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 6px;margin:0 -2px;scrollbar-width:none}
.ocard{flex:1 0 0;min-width:62px;display:flex;flex-direction:column;align-items:center;gap:3px;background:linear-gradient(180deg,#2a211b,#1b1511);border:1px solid var(--hair);border-radius:12px;padding:8px 4px 7px;color:var(--fg);position:relative}
.ocard .por{width:48px;height:48px;border-radius:10px}.ocard .por img{border-radius:8px}
.ocard b{font-size:12.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ocard em{font-style:normal;font-size:11px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ocard.lead{border-color:rgba(236,212,151,.6);box-shadow:0 0 0 1px rgba(236,212,151,.25),0 6px 16px rgba(201,164,92,.15)}
.op-tip{font-size:14px;color:var(--muted);margin:6px 2px 12px;line-height:1.45}.op-tip b{color:var(--fg)}
.arpill{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:linear-gradient(180deg,#2a211b,#1d1712);border:1px solid var(--hair);border-radius:14px;padding:8px 12px 8px 8px;color:var(--fg);margin-bottom:12px}
.arpill img{width:40px;height:auto;border-radius:6px;image-rendering:pixelated;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.arpill span{flex:1;min-width:0;display:flex;flex-direction:column}
.arpill b{font-family:var(--display);font-weight:700;font-size:15px}
.arpill em{font-style:normal;font-size:12.5px;color:var(--muted)}
.arpill .chev{flex:none}
.lg-label{font-size:13px;color:var(--muted)}
/* guide */
.acc{background:var(--card);border:1px solid var(--hair);border-radius:14px;margin-bottom:8px;overflow:hidden}
.acc summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:13px 14px;font-family:var(--display);font-weight:700;font-size:16px;color:var(--fg)}
.acc summary::-webkit-details-marker{display:none}
.acc summary svg{width:22px;height:22px;fill:none;stroke:var(--gild);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.acc summary::after{content:"›";margin-left:auto;color:var(--muted);font-family:var(--body);font-size:22px;transition:transform .2s}
.acc[open] summary::after{transform:rotate(90deg)}
.acc .ab{padding:0 14px 14px;font-size:14.5px;color:var(--muted);line-height:1.5}
.acc .ab b{color:var(--fg)}.acc .ab p{margin:6px 0}
.gl{display:flex;flex-direction:column;gap:9px}
.gcls{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start}
.gcls img{width:36px;image-rendering:pixelated}
.sheet{background:linear-gradient(180deg,#261d17,#1a1411);border-top:1px solid var(--rc);box-shadow:0 -10px 40px rgba(0,0,0,.6)}
.sh-name{font-family:var(--display);font-weight:700;font-size:24px;color:var(--fg)}
.blk h3,.det summary,.ana h3,.syn h3{text-transform:none;letter-spacing:.01em;font-size:13.5px;color:var(--gild)}
.mini-f,.ucard,.optpanel,.ana,.mvp{border-color:var(--hair)}
.merc{background:var(--card);border:1px solid var(--hair);border-left:3px solid var(--rc);border-radius:14px}
.pt{border-radius:10px}
.toast{background:var(--gild-hi);color:var(--ink)}
.merc{grid-template-columns:58px minmax(0,1fr) auto;gap:12px;padding:10px 12px 10px 10px}
.merc .por{padding:2px}.merc .name{font-size:16.5px}
.merc .line{font-size:13.5px;margin-top:4px;gap:10px}
.pwl{margin-left:auto;font-family:var(--display);font-weight:700;color:var(--gild-hi)!important}
.mk-row{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}.mk-row .chips{margin:0}
.chip{background:rgba(116,184,132,.12);border:1px solid rgba(116,184,132,.3);border-radius:999px;padding:1px 8px;font-weight:600}
.chip.neg{background:rgba(196,81,60,.12);border-color:rgba(196,81,60,.35)}
.orow{overflow:visible;gap:6px}.ocard{min-width:0;flex:1 1 0;padding:7px 2px 6px}.ocard .por{width:44px;height:44px}
.ab-u,.ab-e{height:24%;width:27%}.ab-u img{height:58%;margin-top:0}.ab-u span{margin-top:5%}
.ab-u img,.fi-spr img,.por img,.spr,.cell img,.mini-f .spr,.uc-h .spr,.rprev img,.gcls img,.pt{image-rendering:auto!important}
@media (prefers-reduced-motion:reduce){.btn,.acc summary::after{transition:none}}
.gic{display:inline-grid;place-items:center;width:38px;height:38px;flex:none;border-radius:10px;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--gc) 35%,#2a211b),#16110d);border:1px solid color-mix(in srgb,var(--gc) 70%,#000);box-shadow:inset 0 1px 0 rgba(255,240,200,.08)}
.gic svg{width:22px;height:22px;fill:none;stroke:var(--gc);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.gslots{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.gslot{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:linear-gradient(180deg,#2a211b,#1d1712);border:1px solid var(--hair);border-radius:12px;padding:7px 10px 7px 7px;color:var(--fg)}
.gslot span{display:flex;flex-direction:column;min-width:0}.gslot b{font-size:14.5px}.gslot em{font-style:normal;font-size:12.5px;color:var(--muted);line-height:1.3}
.gslot.empty b{color:var(--muted)}
.irow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ir-t{flex:1;min-width:0;display:flex;flex-direction:column}.ir-t b{font-size:14.5px;color:var(--gc)}.ir-t em{font-style:normal;font-size:12.5px;color:var(--muted);line-height:1.3}
.ir-a{display:flex;flex-direction:column;gap:4px}.ir-a .btn{padding:6px 10px}
.shop{display:flex;flex-direction:column;gap:8px}
.shop .irow{background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:8px 10px;border-bottom:1px solid var(--hair)}
.rc-gear{display:flex;gap:3px}.rc-gear .gic{width:20px;height:20px;border-radius:6px}.rc-gear .gic svg{width:12px;height:12px}
.nextc{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,rgba(201,164,92,.16),rgba(201,164,92,.04));border:1px solid rgba(236,212,151,.35);border-radius:14px;padding:10px 10px 10px 14px;margin-bottom:12px}
.nextc p{flex:1;margin:0;font-weight:600;font-size:14.5px;line-height:1.3}.nextc .btn{flex:none;padding:9px 12px}
.tuto{position:relative;background:#f2e3bf;color:#2a1d10;border-radius:14px;padding:12px 14px;margin-bottom:12px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.tuto p{margin:0 0 8px;font-size:14.5px;line-height:1.4}.tuto .btn{background:#2a1d10;color:#f2e3bf;border:0}
.tuto::after{content:"";position:absolute;left:28px;bottom:-7px;width:14px;height:14px;background:#f2e3bf;transform:rotate(45deg)}
.odds{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:13.5px;color:var(--muted);margin:0 2px 12px;min-height:20px}
.odds i{height:7px;border-radius:4px;background:#120e0b;overflow:hidden;display:block}.odds i b{display:block;height:100%;border-radius:4px;transition:width .6s}
.odds em{font-style:normal;font-family:var(--display);font-weight:700;font-size:17px}
.stars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.star{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:12px;color:var(--muted);opacity:0;animation:starIn .45s cubic-bezier(.2,1.6,.4,1) forwards}
.star svg{width:40px;height:40px;fill:#3a2e25;stroke:#5a4a3a;stroke-width:1}
.star.on svg{fill:url(#none);fill:#e8c470;stroke:#fff0bd;filter:drop-shadow(0 0 8px rgba(236,200,110,.7))}
.star.on span{color:var(--fg)}
@keyframes starIn{0%{opacity:0;transform:scale(.3) rotate(-30deg)}100%{opacity:1;transform:none}}
.xpl{display:flex;flex-direction:column;gap:6px}
.xpr{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:6px 10px 6px 6px}
.por.sm{width:36px;height:36px;border-radius:9px;padding:1.5px}.por.sm img{border-radius:7px}
.xpt{display:flex;flex-direction:column;gap:4px;min-width:0}.xpt b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpt i{height:5px;border-radius:3px;background:#120e0b;overflow:hidden;display:block}.xpt i b{display:block;height:100%;background:linear-gradient(90deg,#8a6a2e,#ecd497);border-radius:3px;animation:xpIn 1s ease-out}
@keyframes xpIn{from{width:0!important}}
.xpg{display:flex;flex-direction:column;align-items:flex-end;font-weight:700;font-size:13px;color:var(--gild-hi)}
.xpg em{font-style:normal;font-size:12px;color:#1c140b;background:var(--gild-hi);border-radius:999px;padding:0 7px;margin-top:2px}.xpg em.tt{background:#b17ae6;color:#fff}
.rwg{text-align:center;font-family:var(--display);font-weight:700;font-size:18px;color:var(--gild-hi)}
.ttl{font-style:italic;color:var(--gild);font-size:13px}
.carg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}.carg div{background:var(--panel2);border-radius:10px;padding:6px;text-align:center}.carg b{display:block;font-family:var(--display);font-size:17px;color:var(--fg)}.carg span{font-size:11.5px;color:var(--muted)}
.xpline{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-top:8px}.xpline i{height:5px;border-radius:3px;background:#120e0b;overflow:hidden;display:block}.xpline i b{display:block;height:100%;background:linear-gradient(90deg,#8a6a2e,#ecd497)}
@media (prefers-reduced-motion:reduce){.star{animation:none;opacity:1}.xpt i b{animation:none}}
.rv{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;background:radial-gradient(70% 55% at 50% 45%,color-mix(in srgb,var(--rc) 28%,#1a130e) 0%,rgba(10,7,5,.97) 70%);animation:rvFade .3s ease-out}
@keyframes rvFade{from{opacity:0}}
.rv-rays{position:absolute;left:50%;top:44%;width:900px;height:900px;margin:-450px 0 0 -450px;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--rc) 40%,transparent) 0deg 6deg,transparent 6deg 18deg);opacity:0;border-radius:50%;mask:radial-gradient(circle,#000 0%,transparent 62%);-webkit-mask:radial-gradient(circle,#000 0%,transparent 62%);animation:rvRays 14s linear infinite,rvShow .6s .7s forwards;pointer-events:none}
.rv.r0 .rv-rays,.rv.r1 .rv-rays{display:none}
@keyframes rvRays{to{transform:rotate(360deg)}}@keyframes rvShow{to{opacity:.55}}
.rv-card{width:min(66vw,250px);aspect-ratio:3/4;perspective:900px;position:relative;z-index:1}
.rv-in{position:absolute;inset:0;transform-style:preserve-3d;animation:rvFlip .9s .45s cubic-bezier(.3,1.3,.5,1) forwards}
@keyframes rvFlip{to{transform:rotateY(180deg)}}
.rv-back,.rv-front{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.rv-back{background:linear-gradient(160deg,#3a2c20,#17110d);border:2px solid #c9a45c;box-shadow:0 20px 50px rgba(0,0,0,.6),inset 0 0 0 6px #1a130e,inset 0 0 0 7px rgba(201,164,92,.5)}
.rv-back .crest{width:80px;height:92px}
.rv-front{transform:rotateY(180deg);background:linear-gradient(170deg,color-mix(in srgb,var(--rc) 30%,#221a14),#14100d 75%);border:2px solid var(--rc);box-shadow:0 0 40px color-mix(in srgb,var(--rc) 55%,transparent),0 20px 50px rgba(0,0,0,.6);padding:14px;gap:8px}
.rv-front img.hero{width:86%;filter:drop-shadow(0 8px 10px rgba(0,0,0,.6))}
.rv-front b{font-family:var(--display);font-size:20px;color:var(--fg);text-align:center;line-height:1.1}
.rv-front em{font-style:normal;font-size:13.5px;color:var(--muted);text-align:center}
.rv-front .gic{width:96px;height:96px;border-radius:24px}.rv-front .gic svg{width:58px;height:58px}
.rv-rar{position:relative;z-index:1;font-family:var(--display);font-weight:700;font-size:26px;color:var(--rc);text-shadow:0 0 18px color-mix(in srgb,var(--rc) 70%,transparent);opacity:0;animation:rvShow2 .5s 1.2s forwards}
@keyframes rvShow2{from{opacity:0;transform:translateY(8px) scale(.9)}to{opacity:1;transform:none}}
.rv .btn{position:relative;z-index:1;width:min(80vw,300px);opacity:0;animation:rvShow2 .4s 1.5s forwards}
.spark{position:absolute;left:50%;top:44%;width:8px;height:8px;border-radius:50%;background:var(--rc);opacity:0;animation:spark 1.4s 1.15s ease-out forwards;pointer-events:none}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}
.endscr.win{background:radial-gradient(60% 35% at 50% 6%,rgba(236,200,110,.18),transparent 70%)}
.result{position:relative;font-family:var(--display);font-weight:700;letter-spacing:.02em;animation:resIn .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes resIn{from{opacity:0;transform:scale(.6)}}
.laurel{display:flex;align-items:center;justify-content:center;gap:10px}
.laurel svg{width:46px;height:60px;fill:none;stroke:#c9a45c;stroke-width:1.5;stroke-linecap:round}
.laurel svg.r{transform:scaleX(-1)}
.confetti{position:fixed;top:-12px;width:7px;height:12px;border-radius:2px;z-index:25;pointer-events:none;animation:conf 2.6s ease-in forwards}
@keyframes conf{to{transform:translate(var(--dx),105vh) rotate(var(--rot));opacity:.9}}
.ttl-scr{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:radial-gradient(80% 50% at 50% 38%,#3a2a1a 0%,#120d0a 70%)}
.ttl-scr .rays{position:absolute;left:50%;top:36%;width:1000px;height:1000px;margin:-500px 0 0 -500px;background:repeating-conic-gradient(rgba(236,200,110,.10) 0deg 5deg,transparent 5deg 15deg);border-radius:50%;mask:radial-gradient(circle,#000,transparent 60%);-webkit-mask:radial-gradient(circle,#000,transparent 60%);animation:rvRays 40s linear infinite;pointer-events:none}
.ttl-scr .crest{width:86px;height:100px;position:relative}
.ttl-scr h1{position:relative;font-family:var(--display);font-weight:700;font-size:38px;line-height:1;margin:0;color:var(--gild-hi);text-shadow:0 2px 0 #000,0 0 30px rgba(236,200,110,.35)}
.ttl-scr p{position:relative;margin:0;color:var(--muted);font-size:15px}
.ttl-heroes{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:0;margin:6px 0 4px;height:150px}
.ttl-heroes img{height:130px;filter:drop-shadow(0 10px 8px rgba(0,0,0,.6))}.ttl-heroes img:nth-child(2){height:150px;z-index:1;margin:0 -14px}
.ttl-heroes::after{content:"";position:absolute;left:10%;right:10%;bottom:-2px;height:18px;border-radius:50%;background:radial-gradient(rgba(236,200,110,.35),transparent 70%)}
.ttl-scr .btn{position:relative;width:min(80vw,300px)}
@media (prefers-reduced-motion:reduce){.rv-in{animation:none;transform:rotateY(180deg)}.rv-rays,.ttl-scr .rays,.spark,.confetti{animation:none;display:none}.rv-rar,.rv .btn{animation:none;opacity:1}.result{animation:none}}
/* ===== 1.1 Design système ===== */
:root{--r-s:10px;--r-m:14px;--r-l:18px;--sp1:4px;--sp2:8px;--sp3:12px;--sp4:16px;--sp5:24px;
  --sh-1:0 2px 8px rgba(0,0,0,.35);--sh-2:0 10px 30px rgba(0,0,0,.45);--ease:cubic-bezier(.2,.8,.2,1);
  --glass:rgba(24,19,15,.82);--txt2:#cdbfa6}
html,body{overscroll-behavior:none}
main{scrollbar-width:none;overscroll-behavior:contain}main::-webkit-scrollbar{display:none}
header{position:relative;z-index:5;backdrop-filter:saturate(1.2) blur(10px);-webkit-backdrop-filter:saturate(1.2) blur(10px)}
.vin{animation:vin .28s var(--ease)}
@keyframes vin{from{opacity:0;transform:translateY(8px)}}
.sheet-bg:not([hidden]){animation:bgin .22s ease}
.sheet-bg:not([hidden]) .sheet{animation:shin .32s var(--ease)}
@keyframes bgin{from{background:rgba(8,6,4,0)}}
@keyframes shin{from{transform:translateY(40px);opacity:.4}}
.sheet::before{content:"";display:block;width:42px;height:4px;border-radius:4px;background:rgba(236,212,151,.25);margin:-8px auto 12px}
.btn{transition:transform .12s var(--ease),filter .15s,background .2s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.45;filter:grayscale(.4)}
.toast:not([hidden]){animation:tin .25s var(--ease)}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}
/* composants réutilisables */
.card{background:var(--card);border:1px solid var(--hair);border-radius:var(--r-l);box-shadow:var(--sh-2),inset 0 1px 0 rgba(255,230,170,.04);padding:var(--sp4);margin-bottom:var(--sp3)}
.card.flat{box-shadow:none;padding:var(--sp3)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.card-h h2,.card-h h3{margin:0}
.card-h .lnk{font-size:13.5px;font-weight:700;color:var(--gild)}
.kicker{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gild)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(201,164,92,.14);color:var(--gild-hi);border:1px solid var(--hair)}
.badge.ok{background:rgba(116,184,132,.14);color:#a6dcb2;border-color:rgba(116,184,132,.35)}
.badge.bad{background:rgba(196,81,60,.16);color:#f0a08e;border-color:rgba(196,81,60,.4)}
.dot{position:absolute;top:6px;right:calc(50% - 18px);min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:#d9563f;color:#fff;font-size:10.5px;font-weight:700;line-height:16px;text-align:center;box-shadow:0 0 0 2px #17120e}
.dot:empty{min-width:9px;width:9px;height:9px;padding:0;top:8px;right:calc(50% - 15px)}
.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line);color:var(--fg)}
.lrow:last-child{border-bottom:0}
.lrow .ic{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;background:linear-gradient(180deg,#2e241c,#1f1813);border:1px solid var(--hair)}
.lrow .ic svg{width:21px;height:21px;fill:none;stroke:var(--gild-hi);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.lrow span{flex:1;min-width:0;display:flex;flex-direction:column}
.lrow b{font-weight:700;font-size:15.5px}.lrow em{font-style:normal;font-size:13px;color:var(--muted)}
.lrow .chev{color:var(--gild);font-size:22px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:linear-gradient(180deg,#2a211b,#1c1612);border:1px solid var(--hair);border-radius:var(--r-m);padding:10px 8px;text-align:center}
.tile b{display:block;font-family:var(--display);font-size:20px;color:var(--gild-hi);font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:12px;color:var(--muted)}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:#120e0b;border:1px solid var(--line);margin-bottom:12px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:14px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,#3a2d20,#2a2018);color:var(--gild-hi);box-shadow:inset 0 0 0 1px var(--hair)}
.meter{height:6px;border-radius:4px;background:#120e0b;overflow:hidden}.meter b{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#a5803c,#ecd497)}

  if(!sp||!SKIN[sp]){const x=R(),melee=["berserker","chevalier","moine"].includes(m.cls);
    if(m.cls==="necromancien"&&x<.28)sp="squelette";else if(x<.7)sp="humain";else if(x<.79)sp="nain";else if(x<.87)sp=m.cls==="druide"||m.cls==="archer"?"elfe":"orc";else if(x<.94)sp="elfe";else sp=melee?(R()<.5?"minotaure":"loup"):"humain"}

    hs:fem?P(["long","tresse","queue","chignon"]):P(["court","long","queue","chauve","tresse","court"]),
    beard:fem||sp==="elfe"||sp==="orc"||sp==="gnome"?"none":sp==="nain"?P(["long","tresse"]):P(["none","courte","longue","tresse","moustache","courte"]),
    build:sp==="nain"?1.18:sp==="orc"?1.12:sp==="minotaure"?1.18:sp==="elfe"?.92:fem?.92:P([1,1,1.06,.96]),
    scar:R()<.2,cloth:P(CL[m.cls].cloth),eyes:sp==="elfe"?"#4aa07a":P(["#3a5a7a","#4a3a2a","#3a6a4a","#5a4a3a"])};

function seg(c,pts,w,col){c.lineCap="round";c.lineJoin="round";c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);c.strokeStyle=OUT;c.lineWidth=w+2.2;c.stroke();c.strokeStyle=col;c.lineWidth=w;c.stroke()}
function limb(a1,l1,a2,l2){const kx=Math.sin(a1)*l1,ky=Math.cos(a1)*l1,ex=kx+Math.sin(a1+a2)*l2,ey=ky+Math.cos(a1+a2)*l2;return {kx,ky,ex,ey,a:a1+a2}}
function glow(c,x,y,r,rgb,a){if(LOWFX&&r>30)return;c.save();c.globalCompositeOperation="lighter";const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${rgb},${a})`);g.addColorStop(1,`rgba(${rgb},0)`);c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,TAU);c.fill();c.restore()}
function bolt(c,x1,y1,x2,y2,col,w){c.save();c.globalCompositeOperation="lighter";c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(x1,y1);for(let i=1;i<5;i++){const k=i/5;c.lineTo(lerp(x1,x2,k)+(Math.random()-.5)*5,lerp(y1,y2,k)+(Math.random()-.5)*5)}c.lineTo(x2,y2);c.stroke();c.restore()}
function ell(c,x,y,rx,ry,col,rot){c.beginPath();c.ellipse(x,y,rx,ry,rot||0,0,TAU);c.fillStyle=col;c.fill();c.strokeStyle=OUT;c.lineWidth=1;c.stroke()}
function grad(c,x0,y0,x1,y1,col,a,b){const g=c.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,shade(col,a||1.15));g.addColorStop(1,shade(col,b||.78));return g}
function fill(c,col){c.fillStyle=col;c.fill();c.strokeStyle=OUT;c.lineWidth=1.2;c.stroke()}

  if(F.has("sun")){c.fillStyle="#fff1b0";c.strokeStyle=OUT;c.lineWidth=.8;c.beginPath();c.arc(x,y,3.2,0,TAU);c.fill();c.stroke();glow(c,x,y,14,"255,220,120",.5);c.save();c.translate(x,y);c.rotate(T);c.strokeStyle="rgba(255,236,170,.9)";for(let i=0;i<8;i++){c.rotate(TAU/8);c.beginPath();c.moveTo(0,4);c.lineTo(0,6.5);c.stroke()}c.restore()}
  if(F.has("lightw"))glow(c,x,y,r*2,"255,240,190",.6)}

const MISP=[
  {k:"win",l:"Gagner un match de ligue",n:1,g:40},{k:"fight",l:"Jouer 2 matchs (ligue ou coupe)",n:2,g:30},

  if(!M.bonus&&M.list.every(x=>x.done)){M.bonus=true;S.keys=(S.keys||0)+1;S.chests=S.chests||{};S.chests.bois=(S.chests.bois||0)+1;setTimeout(()=>toast("Toutes les missions du jour : 1 gemme et un coffre en bois"),3200)}}
function missionsHtml(){const M=misState(),L=S.login||{};return `<div class="card"><div class="card-h"><h3 class="h3g">Missions du jour</h3><span class="badge">${M.list.filter(x=>x.done).length}/3</span></div>

  <p class="hint" style="margin:8px 0 0">${M.bonus?"Bonus du jour récupéré.":"Les 3 missions : 1 gemme et un coffre en bois."} Connexion : ${L.streak||1} jour${(L.streak||1)>1?"s":""} d'affilée.</p></div>`}
function dailyCheck(){if(!S)return;const t=today(),L=S.login||{};
  if(L.last!==t){const y=new Date(Date.now()-864e5),yk=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");

const TRES=["gold","keys","frag","awk"];
function testFill(){if(!S||!S.test)return;S.gold=Math.max(S.gold||0,999999);S.keys=Math.max(S.keys||0,999);S.frag=Math.max(S.frag||0,99999);S.awk=Math.max(S.awk||0,999);
  S.chests=S.chests||{};Object.keys(CHESTS).forEach(k=>S.chests[k]=Math.max(S.chests[k]||0,99));S.shards=S.shards||{};S.team.forEach(m=>{if(m.hk)S.shards[m.hk]=Math.max(S.shards[m.hk]||0,999)});S.freeRr=99}

function cxpNeed(n){return 60*n}
function clubLvl(){if(S.cxp==null)S.cxp=stv("fights")*30+stv("wins")*10;let l=1,x=S.cxp;while(l<20&&x>=cxpNeed(l)){x-=cxpNeed(l);l++}return l}

const CUNL={2:"Club rival",3:"Boss de division et reliques",4:"Événements d'arène",6:"Gemmes de palier doublées",10:"Titre « Club illustre »"};
function passTier(){const P=passSt();return Math.min(20,Math.floor(P.xp/50))}
function passSt(){if(!S.pass||S.pass.s!==S.season)S.pass={s:S.season,xp:0,cl:[]};return S.pass}
const passR=t=>t%5===0?{ch:t===20?"divin":t===15?"argent":t===10?"or":"bronze"}:t%3===0?{gem:2}:t%2===0?{frag:5}:{gold:40+10*t};

function codexHtml(o){

  const arm={};F.forEach(m=>arm[ARMOR[m.cls]]=(arm[ARMOR[m.cls]]||0)+1);
  const top=Object.entries(arm).sort((a,b)=>b[1]-a[1])[0];
  const adv={lourde:"dégâts magiques et contondants (mages, moine)",legere:"dégâts perçants et tranchants (archer, assassin, berserker)",robe:"dégâts tranchants (assassin, berserker, barde)",moyenne:null};
  if(top&&adv[top[0]]&&top[1]>=2)lines.push(`${top[1]} combattants en armure ${ARL[top[0]].toLowerCase()} : privilégie les ${adv[top[0]]}.`);
  if(!F.some(m=>m.cls==="clerc"))lines.push("Aucun soigneur : un combat long les use.");
  if(cnt(m=>CAST[m.cls])>=2)lines.push("Ils incantent beaucoup : un moine, un chevalier ou un druide peut interrompre leurs sorts.");
  if(cnt(m=>SHOOTERS.has(m.cls))>=2)lines.push("Plusieurs tireurs : protège les tiens derrière un tank et flanque pour atteindre les leurs.");
  if(cnt(m=>!RANGED.has(m.cls))>=4)lines.push("Très porté sur la mêlée : des tireurs en retrait derrière un rempart les puniront.");
  if(cnt(m=>m.cls==="assassin")>=1)lines.push("Assassin repéré : mets un garde du corps sur tes tireurs.");
  const cap=o.team.find(m=>m.id===o.captain);if(cap)lines.push(`Leur capitaine est ${cap.name} : le faire tomber démoralise l'équipe (règle de cible « Le capitaine »).`);
  return `<div class="blk"><h3>Rapport de recrutement</h3><p><b>Style ${st.l}</b> : ${st.d}</p><p class="tip">${st.tip}</p>${lines.map(l=>`<p>• ${l}</p>`).join("")}</div>`;
}
